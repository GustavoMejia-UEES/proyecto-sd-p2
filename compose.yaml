name: argus

services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: argus-api:local
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS}
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      MONGO_DB: ${MONGO_DATABASE}
      MONGO_USER: ${MONGO_ROOT_USERNAME}
      MONGO_PASSWORD: ${MONGO_ROOT_PASSWORD}
      CAMERA_HEARTBEAT_TIMEOUT_SECONDS: ${CAMERA_HEARTBEAT_TIMEOUT_SECONDS}
    ports:
      - "${API_PORT}:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  edge:
    profiles: ["edge"]
    build:
      context: ./backend/edge
      dockerfile: Dockerfile
    image: argus-edge:local
    restart: unless-stopped
    environment:
      CORE_API_URL: http://api:8000
      CAMERA_ID: ${CAMERA_ID}
      CAMERA_NAME: ${CAMERA_NAME}
      CAMERA_TYPE: ${CAMERA_TYPE}
      CAMERA_SOURCE: ${CAMERA_SOURCE}
      EDGE_STREAM_URL: ${EDGE_STREAM_URL}
      MOTION_ENABLED: ${MOTION_ENABLED}
      MOTION_THRESHOLD: ${MOTION_THRESHOLD}
      MOTION_COOLDOWN_SECONDS: ${MOTION_COOLDOWN_SECONDS}
    ports:
      - "${EDGE_PORT}:8081"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongodb_data:

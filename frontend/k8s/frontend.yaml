apiVersion: v1
kind: ConfigMap
metadata:
  name: argus-frontend-config
data:
  # Replace 100.x.x.x with the Tailscale IPv4 address of Machine A.
  API_URL: "http://100.x.x.x:30080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-frontend
  labels:
    app: argus-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argus-frontend
  template:
    metadata:
      labels:
        app: argus-frontend
    spec:
      containers:
        - name: frontend
          image: sistema-frontend:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: argus-frontend-config
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: argus-frontend
spec:
  type: NodePort
  selector:
    app: argus-frontend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30030
